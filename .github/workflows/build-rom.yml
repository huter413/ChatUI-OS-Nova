name: ChatUI OS Nova ROM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatui-nova-rom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout ChatUI build configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/chromium || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig ccache python3 python3-pip bc rsync lz4 libssl-dev libelf-dev
          df -h

      - name: Configure repo
        run: |
          set -euxo pipefail
          git config --global user.name "ChatUI OS Builder"
          git config --global user.email "chatui-builder@users.noreply.github.com"
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          command -v repo
          repo --version
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync Lineage 23.2 source
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          command -v repo
          rm -rf "$GITHUB_WORKSPACE/android"
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"

          repo init -u https://github.com/accupara/los23.2.git -b lineage-23.2 --depth=1 --no-use-superproject
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/.repo/local_manifests/chatui_veux.xml" .repo/local_manifests/chatui_veux.xml

          df -h
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --retry-fetches=10 --force-sync --force-remove-dirty --prune -j1
          df -h

      - name: Build ChatUI Nova
        working-directory: android
        env:
          CHATUI_VERSION: 1.0
          CHATUI_CODENAME: Nova
        run: bash "$GITHUB_WORKSPACE/build/chatui-build.sh"

      - name: Verify artifacts
        run: |
          set -euxo pipefail
          test -n "$(find android/out-release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          sha256sum android/out-release/* | tee android/out-release/SHA256SUMS.txt

      - name: Upload ROM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChatUI-OS-Nova-1.0-veux
          path: android/out-release/
          if-no-files-found: error
          retention-days: 30
